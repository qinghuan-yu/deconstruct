<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Decision Arena</title>
    <link rel="stylesheet" href="/assets/styles.css?v=4" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-actions">
          <button class="primary-action" id="newChat">开启新对话</button>
        </div>

        <details class="settings-inline" open>
          <summary>模型配置</summary>
          <form class="settings-form" action="/settings/model-form" method="post">
            <label>
              <span>API Key</span>
              <input name="api_key" type="password" autocomplete="off" placeholder="sk-..." />
            </label>
            <label>
              <span>Base URL</span>
              <input name="base_url" autocomplete="off" value="https://api.deepseek.com" />
            </label>
            <label>
              <span>模型名</span>
              <input name="model" autocomplete="off" value="deepseek-chat" />
            </label>
            <button class="secondary-action" type="submit">保存 Key</button>
          </form>
        </details>

        <nav class="conversation-list" id="conversationList"></nav>
      </aside>

      <main class="main">
        <header class="mobile-bar">
          <button class="icon-button" id="openSidebar" title="打开侧栏">菜单</button>
          <span>历史对话</span>
        </header>

        <section class="chat" id="chat">
          <div class="messages" id="messages"></div>
        </section>

        <form class="composer" id="composer">
          <textarea id="promptInput" rows="1" placeholder="输入你的决策问题，Enter 发送，Shift + Enter 换行"></textarea>
          <button class="send-button" id="sendButton" type="submit" title="发送">发送</button>
        </form>
      </main>
    </div>

    <script src="/assets/app.js?v=5"></script>
  </body>
</html>
