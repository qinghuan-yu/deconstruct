services:
  decision-arena:
    build: .
    container_name: decision-arena
    ports:
      - "8000:8000"
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.deepseek.com}
      MODEL_NAME: ${MODEL_NAME:-deepseek-chat}
      DATA_DIR: /app/data
    volumes:
      - decision-arena-data:/app/data
    restart: unless-stopped

volumes:
  decision-arena-data:
